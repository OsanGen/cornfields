name: Publish playtest to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after verification (false builds and captures evidence only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Install isolated browser verifier
        run: |
          npm install --prefix "$RUNNER_TEMP/corn-browser" --no-save --package-lock=false playwright@1.58.2
          ln -s "$RUNNER_TEMP/corn-browser/node_modules/playwright" node_modules/playwright
          browser_path="$(command -v google-chrome)"
          "$browser_path" --version
          echo "CORNFIELD_BROWSER_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
      - name: Verify corridor and field in desktop and touch browsers
        run: node tests/corridor-field-browser.mjs
      - name: Verify player assets and fallback in desktop and touch browsers
        run: npm run test:player:browser
      - name: Run shared game client
        run: |
          CORNFIELD_BASE_PATH=/cornfields/ CORNFIELD_SESSION_SECONDS=90 node scripts/preview-dist.mjs &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          node scripts/verification/web-game-client.mjs --url 'http://127.0.0.1:4180/cornfields/?intro=off' --click-selector '#start-btn' --actions-json '{"steps":[{"buttons":[],"frames":5},{"buttons":["up"],"frames":30}]}' --iterations 1 --screenshot-dir output/corridor-field/client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corridor-field-verification
          path: |
            output/corridor-field/
            output/remaining-upgrade-2026-10-01/browser/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
